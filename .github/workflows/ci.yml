name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest suite
        run: npm test

      - name: Next.js production build
        env:
          DB_DIALECT: sqlite
          SQLITE_PATH: /tmp/crm-ci-build.sqlite
          CRM_SECRET: ci-build-ephemeral-secret
        run: npm run build

  python:
    name: Python Agent & Launcher Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python unit tests
        run: python3 -m unittest discover -s agent/tests -v

      - name: Run agent self-test
        run: python3 agent/agent.py --self-test

      - name: Run desktop operator self-test
        run: python3 agent/desktop_operator.py --self-test

      - name: Run launcher self-test
        run: python3 -m launcher --self-test

  postgres-smoke:
    name: PostgreSQL Migrations & DB Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL migrations & DB smoke tests
        env:
          DB_DIALECT: postgres
          DATABASE_URL: postgres://crm:crm_test_password@localhost:5432/crm_test
          CRM_SECRET: ci-postgres-ephemeral-secret-32-chars-min
        run: npx vitest run tests/postgresSmoke.test.ts
