name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest suite
        run: npm test

      - name: Next.js production build
        env:
          DB_DIALECT: sqlite
          SQLITE_PATH: /tmp/crm-ci-build.sqlite
          CRM_SECRET: ci-build-ephemeral-secret
        run: npm run build

  python:
    name: Python Agent & Launcher Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python unit tests
        run: python3 -m unittest discover -s agent/tests -v

      - name: Run agent self-test
        run: python3 agent/agent.py --self-test

      - name: Run desktop operator self-test
        run: python3 agent/desktop_operator.py --self-test

      - name: Run launcher self-test
        run: python3 -m launcher --self-test
