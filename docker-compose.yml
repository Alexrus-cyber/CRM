services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DB_DIALECT: ${DB_DIALECT:-sqlite}
      SQLITE_PATH: /app/data/crm.sqlite
      CRM_STORAGE_DIR: /app/data/storage
      DATABASE_URL: ${DATABASE_URL:-}
      CRM_SECRET: ${CRM_SECRET:?Set CRM_SECRET in .env}
      CRM_ADMIN_EMAIL: ${CRM_ADMIN_EMAIL:-admin@crm.local}
      CRM_ADMIN_NAME: ${CRM_ADMIN_NAME:-Главный администратор}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:8899}
      CRM_ALLOW_REMOTE_AGENT: ${CRM_ALLOW_REMOTE_AGENT:-1}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - crm_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  crm_data:
  pg_data:
